differences:
  - Isaiah does not list twelve foundations, twelve gates, apostles, tribes, pearls, or transparent gold.
  - Revelation expands the imagery into a measured, cubic city descending from heaven.
  - Isaiah addresses Zion in restoration language; Revelation identifies the city as the bride, the wife of the Lamb.

