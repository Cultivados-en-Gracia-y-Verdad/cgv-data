shared_features:
  - heavenly throne and enthroned figure
  - radiant throne environment
  - four living creatures
  - human, lion, bovine, and eagle imagery
  - extensive eye imagery
  - six wings
  - threefold holiness proclamation
  - thunder or voices and lightning

differences:
  - Ezekiel gives each living creature four faces; Revelation presents four creatures, each with one predominant likeness.
  - Ezekiel gives the creatures four wings; Revelation gives each creature six wings, corresponding to Isaiah's seraphim.
  - Ezekiel places many eyes on the wheel structures; Revelation describes the creatures themselves as full of eyes around and within.
  - Isaiah names seraphim; Revelation calls its beings living creatures.
  - Revelation adds the temporal title 'the one who was and is and is coming.'
  - Similar throne imagery does not establish that every visionary detail is identical across all four passages.

classification:
  relation: composite-image-and-verbal-reuse
  evidence_class: E5
  confidence: high

chronology_effect:
  status: vision-sequence-only
  statement: Revelation places this throne-room vision after the seven messages and before the scroll is opened; the source passages do not supply a shared calendar date.

unresolved_elements:
  - The identity of the twenty-four elders is not established by these passages.
  - Revelation's seven spirits before the throne require a separate comparison and must not be derived automatically from Isaiah 11:2.
  - The glass-like sea is not assigned an Old Testament identity solely from resemblance to Ezekiel's expanse.
