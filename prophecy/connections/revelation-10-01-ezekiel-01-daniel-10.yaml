shared_features:
  - cloud, fire, and surrounding radiance
  - rainbow imagery
  - a brilliant face
  - fiery or radiant lower limbs
  - a powerful heavenly figure

differences:
  - Ezekiel's cloud, fire, and rainbow describe the vision of the likeness of the glory of YHWH, not an angel.
  - Daniel's figure has no cloud or rainbow and is described as a man clothed in linen.
  - Revelation explicitly calls its figure another strong angel and combines features distributed between Ezekiel and Daniel.
  - Revelation compares the face to the sun and the feet to pillars of fire; neither source uses those exact comparisons.

classification:
  relation: composite-image-structure-reuse
  evidence_class: E5
  confidence: high

chronology_effect:
  status: vision-sequence-only
  statement: Revelation places the messenger between the sixth and seventh trumpets; Ezekiel 1 and Daniel 10 do not supply that sequence.

limits:
  - The shared imagery does not establish that Revelation's angel is YHWH, the Messiah, or the same heavenly figure seen by Daniel.
  - The rainbow, cloud, sunlike face, and fiery feet must not each be assigned a universal symbolic meaning apart from their immediate texts.
