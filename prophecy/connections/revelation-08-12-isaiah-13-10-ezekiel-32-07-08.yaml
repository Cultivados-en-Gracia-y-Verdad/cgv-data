shared_features:
  - sun, moon, and stars treated as one ordered luminary cluster
  - loss or darkening of their light
  - resulting reduction of visible day and night light
  - divine judgment setting

differences:
  - Isaiah 13 concerns the day of the LORD against Babylon.
  - Ezekiel 32 addresses Pharaoh and Egypt in a lament.
  - Revelation limits the effect repeatedly to one third of each luminary and one third of day and night.
  - Revelation says the luminaries are struck; the Hebrew passages describe darkening, covering, or withholding light.
  - The source passages do not contain trumpet sequence language.

classification:
  relation: composite-luminary-darkening-reuse
  evidence_class: E5
  confidence: high

chronology_effect:
  status: trumpet-sequence-only
  statement: Revelation places this partial luminary darkening under the fourth trumpet; no shared calendar date is established.

limits:
  - Similar luminary-darkening language does not by itself prove that Isaiah 13, Ezekiel 32, and Revelation 8 describe one identical event.
  - The one-third proportions belong to Revelation and must not be retrojected into the source passages.
  - This record is distinct from Revelation 6:12-14, where the sun, moon, stars, and sky undergo a different described sequence.
