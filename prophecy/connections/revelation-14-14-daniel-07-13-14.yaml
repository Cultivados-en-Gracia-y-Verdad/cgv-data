chronology_effect:
  status: judgment-application
  statement: Revelation applies Daniel's cloud-borne human figure to an earth-harvest judgment scene without reproducing Daniel's full throne-court sequence.

limits:
  - The Daniel connection identifies the literary figure and royal framework, but the harvest must be interpreted from Revelation 14 and its harvest sources.
  - Cloud imagery alone must not be generalized to every biblical cloud scene.
