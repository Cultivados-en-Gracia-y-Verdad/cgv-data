shared_features:
  - a beast or beasts rising from the sea
  - lion, bear, and leopard imagery
  - ten horns
  - political authority represented through beast imagery

differences:
  - Daniel presents four successive and distinct beasts; Revelation combines their animal features into one beast.
  - Daniel's leopard has four heads, whereas Revelation's beast has seven heads.
  - Revelation adds ten diadems, blasphemous names, and authority received from the dragon.
  - Daniel internally identifies the beasts as kings or kingdoms; Revelation 13 must be interpreted within its own explanations and later identifications.

classification:
  relation: composite-reuse
  evidence_class: E5
  confidence: very-high

internal_control:
  statement: Daniel 7:17 and 7:23 interpret its beasts as kings and kingdoms; this controls the source imagery without proving a one-to-one identity for every Revelation feature.

chronology_effect:
  status: structural-sequence
  statement: Revelation deliberately gathers features from Daniel's successive beasts into a single present vision; the combination does not erase Daniel's original sequence.

limits:
  - The literary dependence does not by itself identify a modern nation, ruler, empire, or date.
  - The dragon's grant of throne and authority is a Revelation-specific relationship.
  - The seven heads must not be derived from Daniel's four leopard heads merely by numerical combination.
