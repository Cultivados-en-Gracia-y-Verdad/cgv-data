shared_features:
  - universal invitation to the thirsty
  - movement toward divinely supplied water
  - gift offered without payment
  - willing reception rather than coerced possession

differences:
  - Isaiah includes wine, milk, food, covenant renewal, and return to YHWH.
  - Revelation calls the gift the water of life.
  - Revelation places the invitation on the lips of the Spirit and the bride and includes the hearer's repeated invitation.
  - The first two calls of come may address the returning Jesus in the immediate closing context, while the latter invitation clearly addresses the thirsty recipient; the syntax must not be flattened.

