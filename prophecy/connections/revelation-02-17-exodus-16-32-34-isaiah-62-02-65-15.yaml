    language: hebrew
    hebrew_anchor: וְקֹרָא לָךְ שֵׁם חָדָשׁ אֲשֶׁר פִּי יְהוָה יִקֳּבֶנּוּ
    contribution: a new name given by divine declaration
  - reference: Isaiah 65:15
    language: hebrew
