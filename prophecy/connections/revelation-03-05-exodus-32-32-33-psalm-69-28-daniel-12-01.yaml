shared_features:
  - a divine book
  - personal names or persons recorded in it
  - blotting or remaining written
  - life or deliverance associated with inscription

greek_bridge:
  status: strong-phrase-family
  shared_terms:
    - ἐξαλείφω
    - βιβλίον or βίβλος
    - ζωή
