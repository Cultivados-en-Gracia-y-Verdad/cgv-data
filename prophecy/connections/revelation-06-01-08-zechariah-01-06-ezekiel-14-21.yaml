greek_bridge:
  zechariah_horses:
    status: image-structure-reuse
    note: Revelation preserves a fourfold colored-horse sequence but not Zechariah's chariots, destinations, or interpretation.
  ezekiel_judgments:
    status: near-verbatim-list-reuse
