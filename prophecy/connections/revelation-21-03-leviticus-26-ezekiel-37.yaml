shared_features:
  - God's dwelling among his people
  - reciprocal covenant formula
  - enduring divine presence

differences:
  - Leviticus addresses Israel's covenant obedience in the land.
  - Ezekiel speaks of restored Israel, one king, and an everlasting covenant of peace.
  - Revelation broadens the scene to humanity and uses the plural peoples in its textual form.
  - Revelation's city has no temple building because God and the Lamb are its temple.

classification:
