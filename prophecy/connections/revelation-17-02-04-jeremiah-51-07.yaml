shared_features:
  - an imperial city represented through sexual immorality
  - a golden cup in relation to Babylon
  - nations and rulers intoxicated or corrupted
  - outward splendor joined to inner abomination

differences:
  - Jeremiah calls Babylon a golden cup in YHWH's hand; Revelation places the cup in the woman's hand.
  - Jeremiah speaks of nations drinking Babylon's wine; Revelation defines the wine through her sexual immorality.
  - Nahum addresses Nineveh, not Babylon.
  - Revelation combines city, prostitute, cup, beast, and universal-rule imagery into its own vision.

classification:
  relation: composite-city-prostitution-and-cup-reuse
  evidence_class: E5
  confidence: very-high

limits:
  - Similar prostitution imagery does not make every condemned city the same entity.
  - The golden cup is a literary judgment image and does not identify a physical artifact.
  - Revelation's own naming of Babylon the Great and interpretation of the woman as the ruling great city control the record.
