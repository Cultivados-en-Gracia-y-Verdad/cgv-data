shared_features:
  - two olive trees
  - lampstand imagery
  - standing before the Lord of all the earth
  - an interpreted visionary symbol rather than an inferred resemblance alone

differences:
  - Zechariah has one golden lampstand flanked by two olive trees; Revelation calls the witnesses two olive trees and two lampstands.
  - Zechariah identifies the figures as two sons of oil; Revelation identifies them as God's two witnesses and prophets.
  - Zechariah does not assign a 1,260-day ministry, sackcloth, death, resurrection, or ascent.

classification:
  relation: explicit-interpretive-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: revelation-specific
  statement: Zechariah supplies the interpreted imagery but not Revelation's 1,260-day sequence.

limits:
  - The explicit Zechariah reuse does not by itself identify the witnesses as specific named historical persons.
  - The transformation from one lampstand to two must be preserved rather than harmonized away.
