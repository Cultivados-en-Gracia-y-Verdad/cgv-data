sources:
  - reference: Isaiah 56:5
    language: hebrew
    hebrew_anchor: וְנָתַתִּי לָהֶם בְּבֵיתִי וּבְחוֹמֹתַי יָד וָשֵׁם ... שֵׁם עוֹלָם אֶתֶּן־לוֹ אֲשֶׁר לֹא יִכָּרֵת
    contribution:
      - a permanent place within God's house and walls
      - a divinely given enduring name
    greek_witness_anchor: ὄνομα αἰώνιον δώσω αὐτοῖς, καὶ οὐκ ἐκλείψει
  - reference: Isaiah 62:2
    language: hebrew
    hebrew_anchor: וְקֹרָא לָךְ שֵׁם חָדָשׁ אֲשֶׁר פִּי יְהוָה יִקֳּבֶנּוּ
    contribution: a new name assigned by the LORD
    greek_witness_anchor: τὸ ὄνομά σου τὸ καινόν
  - reference: Ezekiel 48:35
    language: hebrew
    hebrew_anchor: וְשֵׁם־הָעִיר מִיּוֹם יְהוָה שָׁמָּה
