  note: Ezekiel uses a mark-sign vocabulary; Revelation uses sealing vocabulary. The action sequence is more decisive than an exact shared noun.

shared_features:
  - divine authorization
  - forehead as the location of the sign
  - marking or sealing before judgment
  - protection or distinction of a defined group

differences:
  - Ezekiel marks those grieving over Jerusalem's abominations; Revelation seals servants of God.
  - Ezekiel's sign is a תו; Revelation uses σφραγίζω and does not call the seal a tau.
  - Revelation delays harm to earth, sea, and trees; Ezekiel restrains executioners from approaching marked persons.

