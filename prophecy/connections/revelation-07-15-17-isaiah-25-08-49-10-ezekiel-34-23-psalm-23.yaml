    greek_witness_anchor: ἀφεῖλεν κύριος ὁ θεὸς πᾶν δάκρυον ἀπὸ παντὸς προσώπου
  - reference: Ezekiel 34:23
    language: hebrew
    hebrew_anchor: וַהֲקִמֹתִי עֲלֵיהֶם רֹעֶה אֶחָד וְרָעָה אֶתְהֶן אֵת עַבְדִּי דָוִד
    contribution: one divinely appointed shepherd tends the flock
  - reference: Psalm 23:1-2
    language: hebrew
