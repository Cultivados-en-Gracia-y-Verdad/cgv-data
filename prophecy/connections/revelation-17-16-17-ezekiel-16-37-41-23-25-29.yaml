    - the ten kings
  ultimate_control:
    - God places the execution of his purpose in their hearts

chronology_effect:
  status: narrative-reversal
  statement: The coalition that supports the woman turns against her before the beast's own final defeat; no external date is supplied.

limits:
  - Ezekiel's use of the pattern for Jerusalem and Samaria does not identify Revelation's Babylon as either city.
  - The judgment pattern must not be transferred indiscriminately to every city described as unfaithful.
  - The record does not identify the beast, ten kings, or great city with modern entities.
