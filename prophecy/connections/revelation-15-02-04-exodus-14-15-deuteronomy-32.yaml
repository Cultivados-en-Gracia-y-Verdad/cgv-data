  key_families:
    - ᾠδή + Μωϋσῆς
    - θαυμαστός + ἔργον
    - δίκαιος + ὁδός
    - φοβέομαι + κύριος
    - ἔθνη + ἥκω + προσκυνέω + ἐνώπιον

shared_features:
  - deliverance followed by song
  - Moses explicitly named
  - victory associated with a sea setting
  - praise of God's wondrous works and just ways
  - fear and glorification of the divine name
  - the nations coming to worship

differences:
  - Exodus describes Israel's deliverance from Egypt at the sea; Revelation describes victory over the beast, its image, and its number.
  - Revelation's sea is glasslike and mixed with fire; Exodus does not use that description.
  - Revelation names the song both the song of Moses and the song of the Lamb.
  - The wording of Revelation 15:3-4 is a composite and is not a verbatim reproduction of one Mosaic song.

classification:
  relation: composite-victory-song-reuse
  evidence_class: E5
  confidence:
    exodus_victory_song_frame: very-high
    deuteronomy_justice_formula: high
    psalm_nations_worship_formula: very-high
    jeremiah_fear_question: high
    glass_sea_identical_to_exodus_sea: not-established

chronology_effect:
  status: typological-sequence-only
  statement: Deliverance precedes the victory song in both scenes, but Exodus does not determine Revelation's plague chronology.

limits:
  - The literary reuse does not make Egypt and the beast identical entities.
  - The sea imagery must not be converted into a geographic identification.
  - The song of the Lamb is Revelation's own christological addition and must not be read back into the wording of Exodus or Deuteronomy.
