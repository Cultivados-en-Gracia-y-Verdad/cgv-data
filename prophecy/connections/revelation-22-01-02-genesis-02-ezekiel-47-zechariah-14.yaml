shared_features:
  - divinely sourced life-giving river
  - tree or trees associated with perpetual life and fruitfulness
  - water flowing from a holy center
  - leaves associated with healing

differences:
  - Genesis has one Edenic river dividing into four heads and does not mention healing leaves.
  - Ezekiel has many food trees along the river; Revelation speaks collectively of the tree of life on both sides of the river.
  - Ezekiel's water flows from the temple; Revelation has no temple building and the river flows from the throne of God and the Lamb.
  - Zechariah's living waters flow toward two seas; Revelation does not repeat that geography.
  - Revelation uniquely specifies twelve fruits, monthly yield, and healing of the nations.

classification:
  relation: composite-eden-temple-and-jerusalem-river-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: revelation-controlled
  statement: The source passages supply the images; Revelation places their transformed fulfillment within the new Jerusalem after the final judgment.

limits:
  - The river must not be mapped onto a modern waterway.
  - The healing of the nations does not by itself prove continuing disease or mortality in the new creation.
  - The singular tree language must not be used to erase Ezekiel's plural trees or force a botanical reconstruction.
