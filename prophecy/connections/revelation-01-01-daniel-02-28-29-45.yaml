greek_bridge:
  status: verified-phrase-family-pending-witness-token-record
  shared_sequence: ἃ δεῖ γενέσθαι
  note: Ancient Greek Daniel witnesses use the phrase family 'what must happen'; the exact Old Greek and Theodotion token records remain to be stored separately.

shared_features:
  - divine disclosure
  - disclosure to a servant or royal recipient through a mediated revelation
  - the distinctive clause 'what must happen'
  - a temporal qualifier following the clause

differences:
  - Daniel uses afterward or latter-days language; Revelation 1:1 uses ἐν τάχει.
  - Revelation identifies Jesus Christ, his servants, an angel, and John within its own disclosure chain.
  - The shared disclosure formula does not equate every disclosed event in Daniel 2 with every event in Revelation.

