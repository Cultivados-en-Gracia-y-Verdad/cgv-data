sources:
  - reference: Zechariah 3:9
    language: hebrew
    hebrew_anchor: על אבן אחת שבעה עינים
    contribution: seven eyes associated with a divinely appointed object in the prophetic vision
  - reference: Zechariah 4:10
    language: hebrew
    hebrew_anchor: שבעה אלה עיני יהוה המה משוטטים בכל הארץ
