shared_features:
  - a divinely held or presented scroll/book
  - writing on both sides from Ezekiel
  - sealing language from Daniel
  - access to the contents is restricted

differences:
  - Ezekiel's scroll is opened before him and contains lamentation, mourning, and woe; Revelation's scroll is sealed with seven seals.
  - Daniel commands sealing until the time of the end; Revelation presents the question of who is worthy to open the scroll.
  - Revelation does not explicitly identify its scroll as either Ezekiel's scroll or Daniel's book.
  - Seven seals are unique to Revelation in this comparison.

classification:
  relation: composite-scroll-and-sealing-reuse
  evidence_class: E4
  confidence: high-for-written-front-and-back; moderate-for-Daniel-sealing-combination

chronology_effect:
  status: narrative-sequence
  statement: The scroll is present before the Lamb takes it and before the seals are opened. Daniel's 'until the time of the end' is not automatically transferred as a date definition.

unresolved_questions:
  - What does Revelation itself reveal about the scroll's contents as each seal is opened?
  - Does the sevenfold sealing signify completeness, or should that remain descriptive without assigning a symbolic definition?
