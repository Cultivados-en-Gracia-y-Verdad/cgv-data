shared_features:
  - exact Hebrew noun אֲבַדּוֹן preserved by Greek transliteration Ἀβαδδών
  - association with Sheol, death, or destruction
  - destructive semantic field reflected by Greek Ἀπολλύων, 'destroyer'

differences:
  - In Job and Proverbs, Abaddon is a realm, condition, or personified destruction term.
  - Revelation explicitly presents Abaddon/Apollyon as the name of the angel-king of the abyss locusts.
  - The Hebrew Bible passages do not identify Abaddon as an angel or king.

