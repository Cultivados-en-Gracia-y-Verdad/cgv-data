shared_features:
  - a divine throne and universal judgment setting
  - books opened before judgment
  - persons evaluated in relation to written records
  - a distinct register associated with life or deliverance
  - resurrection and final divergent outcomes

differences:
  - Daniel 7 does not call its opened books the book of life or explicitly say judgment is according to each person's works.
  - Daniel 12 mentions one book and resurrection but does not describe the sea, Death, and Hades surrendering the dead.
  - Psalm 69 and Exodus 32 use life-book or divine-book language in prayer and covenant judgment, not the full great-white-throne scene.
  - Revelation distinguishes plural books recording works from another book, the book of life.
  - Revelation uniquely calls the lake of fire the second death and casts Death and Hades into it.

classification:
