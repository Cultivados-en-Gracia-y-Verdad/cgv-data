    individual_rider_identity: unresolved
    four_judgments_list: high

chronology_effect:
  status: seal-sequence
  statement: Revelation orders the riders under the first four seals; Zechariah and Ezekiel do not establish the same seal chronology.

limits:
  - The connection does not identify Revelation's riders with Zechariah's interpreting categories beyond the shared horse-vision structure.
  - Horse color alone cannot establish identity across passages.
