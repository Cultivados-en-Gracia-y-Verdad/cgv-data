shared_features:
  - cosmic darkening and disturbance
  - falling heavenly bodies
  - heavens rolled like a scroll
  - mountains, rocks, and caves as attempted refuge
  - the great day of divine wrath or coming
  - the question of who can stand

differences:
  - Revelation combines material from several prophetic judgment scenes into one seal vision.
  - Isaiah 34 describes the host of heaven with leaf and fig imagery; Revelation presents stars falling like unripe figs shaken by a great wind.
  - Hosea addresses judgment upon Israel's high places; Revelation universalizes the social range of those hiding.
  - Revelation names the wrath of the enthroned one and the Lamb within its own vision.
  - Similar day-of-the-LORD wording does not prove that every source passage refers to one indivisible historical event.

classification:
  relation: composite-verbal-and-image-reuse
  evidence_class: E5
  confidence: high

chronology_effect:
  status: sixth-seal-sequence
  statement: Revelation places this composite judgment scene under the sixth seal. The reused prophets supply judgment language but do not independently assign Revelation's seal order.

limits:
  - Cosmic imagery must be interpreted within each passage before any literal or symbolic transfer is made.
  - The phrase 'great day' does not by itself establish identity with every prophetic day passage.
  - Revelation 6:17's plural textual form of wrath must be handled according to the Greek textual witness used by the project.
