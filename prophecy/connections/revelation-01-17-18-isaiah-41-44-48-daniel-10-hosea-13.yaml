  evidence_class: E5
  confidence: high

limits:
  - The reuse record states what wording and scene structures converge; it does not import an external formulation of their theological relationship.
  - Possession of keys is Revelation's own explicit statement and must not be read backward into Hosea as though Hosea used the same image.

