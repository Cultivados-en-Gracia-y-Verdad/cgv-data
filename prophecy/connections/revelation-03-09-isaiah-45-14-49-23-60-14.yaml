shared_features:
  - hostile or opposing group comes
  - bowing at the feet of the addressed party
  - resulting acknowledgment or knowledge
  - divine action reverses the prior relationship

differences:
  - Isaiah addresses Zion or Israel in the cited contexts.
  - Revelation addresses the church in Philadelphia and states that the group will know that the speaker loved it.
  - The record does not transfer every national, geographic, or restoration detail from Isaiah to Philadelphia.

classification:
  relation: composite-reuse
  evidence_class: E5
  confidence: high

limits:
  - Bowing before the feet does not establish worship of the human recipients; the action and its object must be interpreted within each passage.
  - Revelation applies the Isaiah scene without explicitly explaining the full identity relationship between Zion and the addressed congregation.

chronology_effect:
  status: promised-future-reversal
  statement: Revelation presents the coming, bowing, and knowing as a future act the speaker will cause.
