greek_bridge:
  status: strong-multi-source-correspondence
  note: Several features align closely with Greek Daniel and Ezekiel wording, but this record classifies the whole unit as a composite image structure rather than one continuous quotation.

shared_features:
  - Revelation fuses Daniel 7's son-of-man and white-hair imagery with Daniel 10's clothed figure and fiery-metal features.
  - Ezekiel supplies the many-waters voice image.
  - Isaiah supplies the mouth-sword image.
  - Exodus supplies the golden lampstand setting, while Revelation internally identifies the seven lampstands as seven churches in Revelation 1:20.

differences:
  - Daniel 7 distinguishes the Ancient of Days from one like a son of man; Revelation 1 places white-hair imagery on the one like a son of man.
  - Daniel 10 says the voice is like the sound of a multitude; Revelation uses many waters, closer to Ezekiel.
  - Isaiah 49 speaks of the servant's mouth as like a sharp sword; Revelation depicts a sword proceeding from the mouth.
  - Exodus has one lampstand with branches; Revelation has seven lampstands and supplies its own interpretation.

classification:
  relation: composite-image-structure-reuse
  evidence_class: E5
  confidence: high

limits:
  - The fusion of images does not collapse the speakers or figures of Daniel, Ezekiel, Isaiah, and Exodus into one referent in their original settings.
  - Revelation's explicit interpretation of the lampstands controls their meaning within Revelation.
  - Each image must remain separately traceable to its source candidate.

