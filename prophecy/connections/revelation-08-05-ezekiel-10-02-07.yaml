  statement: In Revelation, altar fire is cast to earth after the saints' prayers ascend and before the seven trumpets sound.

limits:
  - The connection does not prove that Ezekiel's city judgment and Revelation's trumpet judgments are the same event.
  - The altar in Revelation is not identified with Ezekiel's cherubim complex.
