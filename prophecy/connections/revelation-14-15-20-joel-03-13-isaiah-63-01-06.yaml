    - πατέω
    - θυμός

shared_features:
  - a commanded sickle
  - harvest declared ripe
  - grape gathering
  - winepress imagery
  - divine wrath expressed through treading

differences:
  - Joel places grain harvest and winepress images together in a summons against nations.
  - Isaiah focuses on a single divine warrior treading alone.
  - Revelation presents two successive harvest actions: earth harvest by the cloud-borne figure and grape harvest by an angel.
  - Revelation adds the location outside the city and a quantified blood-flow image.

classification:
  relation: composite-harvest-and-winepress-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: sequential-within-revelation
  statement: Revelation distinguishes the first earth harvest from the subsequent grape harvest; the source imagery must not collapse them into one action without textual warrant.

limits:
  - The record does not determine whether the first harvest is salvation, judgment, or a mixed gathering solely from the word harvest.
  - Revelation's blood depth and distance are unique details and must not be imported into Joel or Isaiah.
  - The city is not externally identified by these source texts.
