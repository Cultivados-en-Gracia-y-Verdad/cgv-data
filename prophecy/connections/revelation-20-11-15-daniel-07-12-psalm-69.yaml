  evidence_class: E5
  confidence:
    opened_judgment_books: very-high
    written_book_and_deliverance: very-high
    book_of_life_title: high

chronology_effect:
  status: revelation-controlled
  statement: The sources establish judgment, resurrection, and written heavenly records; Revelation supplies the final sequence after the Gog-Magog judgment and the fate of Death and Hades.

limits:
  - The plural books and the book of life must remain textually distinct.
  - The record does not specify the contents, physical form, or mechanism of the heavenly books beyond the biblical wording.
  - Judgment according to works must not be reduced to a claim that Revelation describes only one undifferentiated record.
  - The source links do not independently resolve every theological question about resurrection, salvation, or degrees of judgment.
