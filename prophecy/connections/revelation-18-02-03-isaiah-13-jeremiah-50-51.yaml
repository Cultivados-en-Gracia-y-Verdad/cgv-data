shared_features:
  - Babylon explicitly named and declared fallen
  - desolation expressed through habitation by unclean or desert creatures
  - nations affected by Babylon's wine
  - wealth and imperial influence preceding judgment

differences:
  - Isaiah and Jeremiah describe historical Babylon through desert-creature imagery.
  - Revelation explicitly adds demons, unclean spirits, unclean birds, global merchants, kings, and sexual-immorality language.
  - Revelation's Babylon is interpreted within Revelation 17-18 as a ruling great city and commercial power.

classification:
  relation: composite-babylon-desolation-reuse
  evidence_class: E5
  confidence: very-high

limits:
  - The creature imagery does not require a zoological or geographical fulfillment.
  - The connection does not independently identify Revelation's Babylon with one modern nation, city, church, or economic system.
  - Jeremiah 51:7 contributes the intoxicating-nations image but Revelation transforms the cup's function and ownership.
