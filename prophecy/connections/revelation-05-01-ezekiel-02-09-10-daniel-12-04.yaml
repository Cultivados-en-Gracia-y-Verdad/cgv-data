  language: greek
  original: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά
  source_anchor:
    corpus: MorphGNT
    verse_code: 270501

sources:
  - reference: Ezekiel 2:9-10
    language: hebrew
    hebrew_anchors:
      - מגלת ספר
      - והיא כתובה פנים ואחור
    contribution:
      - a scroll presented by a divine hand
      - writing on front and back
  - reference: Daniel 12:4
    language: hebrew
    hebrew_anchor: סתם הדברים וחתם הספר עד עת קץ
    contribution:
      - a book or writing sealed until a specified future time
  - reference: Daniel 12:9
    language: hebrew
    hebrew_anchor: כי סתמים וחתמים הדברים עד עת קץ
