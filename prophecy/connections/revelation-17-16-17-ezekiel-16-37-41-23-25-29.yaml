shared_features:
  - a prostitute or adulterous city judged through former partners
  - hatred replacing alliance
  - exposure and nakedness
  - plunder or consumption
  - burning with fire
  - hostile agents carrying out divine judgment

differences:
  - Ezekiel addresses Jerusalem and Samaria within covenant-adultery indictments.
  - Revelation applies the pattern to Babylon the Great, explicitly interpreted as the ruling great city.
  - Revelation adds the beast and ten kings as the agents.
  - Revelation uniquely states that God placed his purpose in their hearts until his words are fulfilled.
  - The statement that they eat her flesh is more graphic than Ezekiel's plunder and violent-destruction wording.

classification:
