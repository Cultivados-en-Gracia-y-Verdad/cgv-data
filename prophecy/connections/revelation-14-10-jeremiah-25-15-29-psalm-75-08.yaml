sources:
  - reference: Jeremiah 25:15-29
    language: hebrew
    hebrew_anchors:
      - קַח אֶת־כּוֹס הַיַּיִן הַחֵמָה הַזֹּאת מִיָּדִי
      - וְהִשְׁקִיתָה אֹתוֹ אֶת־כָּל־הַגּוֹיִם
      - וְשָׁתוּ וְהִתְגֹּעֲשׁוּ וְהִתְהֹלָלוּ
