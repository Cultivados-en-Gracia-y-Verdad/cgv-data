chronology_effect:
  status: explicit-revelation-duration-only
  statement: Revelation assigns five months of permitted torment; neither Exodus nor Joel supplies that duration for this scene.

limits:
  - Shared original-language patterns establish literary reuse, not identity of the historical Exodus plague, Joel's army, and Revelation's fifth-trumpet agents.
  - The star, abyss, scorpion tails, and five-month duration require Revelation's own interpretation and must not be imported into Joel or Exodus.
