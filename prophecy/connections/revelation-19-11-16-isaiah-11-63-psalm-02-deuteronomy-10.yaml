shared_features:
  - a faithful and righteous ruler who judges
  - destructive authority proceeding from the mouth
  - rule over the nations with an iron rod
  - garments associated with blood and winepress judgment
  - supreme royal and lordly authority

differences:
  - Revelation presents a mounted heavenly warrior named the Word of God; the source passages do not use that title or horse scene.
  - Isaiah 11 speaks of the Davidic shoot and judicial speech; Revelation depicts a sharp sword proceeding from the mouth.
  - Isaiah 63 describes the warrior returning from trampling; Revelation's garment is already dipped in blood before the narrated battle.
  - Deuteronomy says God of gods and Lord of lords; Revelation's title is King of kings and Lord of lords.

classification:
  relation: composite-messianic-and-divine-warrior-reuse
  evidence_class: E5
  confidence:
    righteous_mouth_judgment: very-high
    iron_rod: explicit-near-verbatim
    winepress_and_blooded_garment: very-high
    supreme_title: high

chronology_effect:
  status: none-from-sources
  statement: The sources establish the warrior's character and actions but do not independently date Revelation's battle.

limits:
  - The blood on the garment is not explicitly identified in Revelation 19:13 as the rider's own blood or the blood of enemies.
  - Shared warrior imagery does not collapse Isaiah 11, Psalm 2, Isaiah 63, and Deuteronomy 10 into one original historical scene.
  - No modern military technology, nation, or ruler is identified by these images.
