greek_bridge:
  status: strong-phrase-correspondence
  shared_terms:
    - πρωτότοκος
    - βασιλεῖς τῆς γῆς
    - βασίλειον or βασιλεία phrase family
    - ἱερεῖς
  note: Exact wording differs across the Greek witnesses and Revelation; the cluster remains distinctive.

shared_features:
  - Revelation joins royal firstborn language with a kingdom-priest identity.
  - Psalm 89 supplies the firstborn and kings-of-the-earth royal frame.
  - Exodus 19 supplies the kingdom-priest wording.
  - Isaiah 61 reinforces the priest designation.

differences:
  - Revelation adds 'from the dead' to firstborn.
  - Revelation calls Jesus the ruler of the kings of the earth rather than reproducing Psalm 89's syntax exactly.
  - Exodus addresses Israel in its covenant setting; Revelation applies kingdom-priest language to those made so by Jesus.

classification:
