differences:
  - Exodus describes literal frogs from the Nile; Revelation describes three unclean spirits like frogs emerging from three mouths.
  - Exodus's magicians reproduce the frog sign but do not gather kings for war.
  - Revelation explicitly identifies the agents as demonic spirits performing signs.
  - Revelation uses the frog likeness as part of a global deception-and-gathering scene.

