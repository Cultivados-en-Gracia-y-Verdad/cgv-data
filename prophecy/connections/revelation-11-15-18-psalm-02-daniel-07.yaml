shared_features:
  - rebellious nations
  - the Lord and his anointed
  - divine wrath
  - heavenly judgment
  - everlasting kingdom
  - the holy servants receiving vindication or reward

differences:
  - Revelation announces that the kingdom of the world has become the kingdom of the Lord and his Christ; neither source uses that exact formula.
  - Daniel distinguishes the one like a son of man and the holy ones while Revelation names the Lord and his Christ and then God's servants, prophets, and saints.
  - Revelation explicitly mentions judgment of the dead and destruction of those destroying the earth; these details are not stated in Psalm 2 or Daniel 7 in the same form.
  - Revelation embeds the proclamation at the seventh trumpet.

classification:
  relation: composite-kingdom-judgment-reuse
  evidence_class: E5
  confidence: high

chronology_effect:
  status: revelation-sequence-only
  statement: Psalm 2 and Daniel 7 supply kingdom and judgment structures, but Revelation alone places this proclamation at the seventh trumpet.

limits:
  - The shared kingdom language does not by itself resolve every relationship among the Lord, his Christ, the son-of-man figure, and the holy ones.
  - The seventh trumpet must not be synchronized with another prophetic event without explicit textual evidence.
