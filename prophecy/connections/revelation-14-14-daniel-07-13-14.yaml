  - association with a heavenly cloud or clouds
  - royal presentation
  - authority exercised over the earth or nations

differences:
  - Daniel's figure comes with the clouds to the Ancient of Days and receives dominion.
  - Revelation's figure sits on a white cloud and carries a sharp sickle for harvest.
  - The golden crown and harvest action are not stated in Daniel 7:13-14.

