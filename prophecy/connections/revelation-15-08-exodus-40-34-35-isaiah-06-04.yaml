greek_bridge:
  status: strong-scene-continuity
  key_families:
    - γεμίζω + ναός/σκηνή
    - δόξα θεοῦ/κυρίου
    - καπνός/νεφέλη
    - οὐ δύναμαι + εἰσέρχομαι

shared_features:
  - sanctuary filled by a visible manifestation of divine presence
  - glory associated with cloud or smoke
  - access or service prevented while the manifestation fills the sanctuary

differences:
  - Exodus and Kings describe cloud; Revelation and Isaiah explicitly use smoke.
  - Revelation attributes the smoke to God's glory and power and links the access restriction to completion of seven plagues.
  - Exodus restricts Moses, and Kings restricts priestly service; Revelation states that no one can enter.
  - Revelation's sanctuary is heavenly and part of a final-plague vision.

classification:
  relation: composite-sanctuary-glory-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: explicit-revelation-limit
  statement: Revelation alone states that access remains closed until the seven plagues are completed.

limits:
  - The smoke must not be assigned a universal meaning apart from divine glory, power, and judgment in this scene.
  - The earlier sanctuary-fillings are not identified as the same historical event as Revelation 15.
  - The inability to enter does not establish the permanent closure of the heavenly sanctuary.
