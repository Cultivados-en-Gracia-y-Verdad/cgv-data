findings:
  explicit:
    - Revelation 12:6 and 12:14 repeat the same subject, wilderness location, and nourishment action while assigning 1,260 days in one statement and a time, times, and half a time in the other.
    - Revelation 11 places forty-two months and 1,260 days in adjacent statements, but the text does not explicitly say their start and end points are identical.
    - Revelation 13 states forty-two months for the beast's authority but does not explicitly equate that duration with Revelation 11 or 12.
  arithmetic_observation:
    expression: 1260 / 42 = 30
    meaning: The two numerical durations are equal under a thirty-day-month model.
    authority: arithmetic-only
    warning: Arithmetic compatibility is not itself a scriptural statement that every prophetic month has thirty days.
  unresolved:
    - Whether the plural “times” denotes exactly two times in every occurrence.
    - Whether “time” means a year in these passages.
    - Whether every occurrence describes the same chronological interval.
    - Whether the forty-two-month periods in Revelation 11 and 13 are coextensive.
    - Whether Daniel 7:25, Daniel 12:7, and Revelation 12:14 refer to the same event or only use corresponding duration language.

classification:
  revelation_12_06_to_12_14:
    evidence_class: E4
    status: derived-within-passage
    conclusion: Strong evidence that the two expressions describe the same duration in Revelation 12's own account.
  forty_two_months_to_1260_days:
    evidence_class: E3
    status: arithmetic-compatible-not-explicitly-equated
  daniel_to_revelation:
    evidence_class: E3
    status: shared-duration-wording-no-identity

chronology_rule: Do not place separate events on the same dates solely because their stated durations are arithmetically compatible.
