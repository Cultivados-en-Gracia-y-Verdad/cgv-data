shared_features:
  - a reed used as a measuring instrument
  - a visionary command involving sacred architecture
  - measured and distinguished spaces

differences:
  - Ezekiel's guide performs the measurements; Revelation's seer is told to measure.
  - Ezekiel measures an extensive temple complex, while Revelation names the sanctuary, altar, and worshipers.
  - Revelation explicitly excludes the outer court and assigns it to the nations; Ezekiel 40 does not contain that exclusion.
  - Measuring worshipers has no direct equivalent in Ezekiel 40.

