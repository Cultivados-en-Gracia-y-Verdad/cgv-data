  language: hebrew
  hebrew_anchor: אֱלֹהֵי אָמֵן
  contribution: the divine title 'God of Amen' or 'God of truth/faithfulness'

greek_bridge:
  status: wording-differs
  note: The selected Greek Old Testament witness renders the title by truth-language rather than transliterating ἀμήν; Revelation preserves Ἀμήν as a title.

shared_features:
  - Amen functions as a title rather than merely a concluding response.
  - The title is joined in Revelation with faithful and true witness language.
  - Both contexts associate the title with divine reliability.

differences:
  - Isaiah's title is explicitly 'God of Amen'; Revelation applies 'the Amen' to the speaker.
  - Revelation adds 'the faithful and true witness' and 'the beginning of God's creation.'
  - This record does not derive the meaning of ἀρχή from Isaiah 65:16.

