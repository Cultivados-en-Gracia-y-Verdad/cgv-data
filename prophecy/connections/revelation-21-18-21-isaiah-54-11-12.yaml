limits:
  - Stone correspondences must not be forced into one-to-one symbolic meanings without textual support.
  - The gemstones do not authorize astrological, mystical, or modern national mappings.
  - Isaiah's restoration image contributes to Revelation's city portrait but does not exhaust its architecture.
