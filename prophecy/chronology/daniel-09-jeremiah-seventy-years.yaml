schema_version: 1
record_type: chronology-context
id: daniel-09-jeremiah-seventy-years
status: collecting
reference_scope:
  - Daniel 9:1-3
  - Jeremiah 25:1-12
  - Jeremiah 29:1-14
  - 2 Chronicles 36:20-23
language_scope: [hebrew]

question: What chronological information does Daniel explicitly derive from Jeremiah's seventy years, and how does it relate to the seventy sevens announced afterward?

explicit_connection:
  source: Daniel 9:2
  statement: Daniel understands from the writings of Jeremiah the number of years concerning the completion of Jerusalem's desolations.
  duration: seventy years
  evidence_class: E1

jeremiah_records:
  - reference: Jeremiah 25:11-12
    explicit_duration: seventy years
    subjects:
      - the land becomes a desolation and horror
      - nations serve the king of Babylon
      - after seventy years Babylon and the Chaldeans are punished
  - reference: Jeremiah 29:10
    explicit_duration: seventy years for Babylon
    stated_afterward: YHWH visits the exiles and performs his good word to return them

chronicles_connection:
  reference: 2 Chronicles 36:20-23
  explicit_elements:
    - service to the king of Babylon until the kingdom of Persia
    - fulfillment of the word by Jeremiah
    - land enjoys its sabbaths during desolation
    - seventy years are fulfilled
    - proclamation of Cyrus in his first year
  evidence_class: E1

sequence_in_daniel_9:
  - Daniel recognizes Jeremiah's seventy-year chronology.
  - Daniel turns to God in prayer, confession, and supplication.
  - Gabriel arrives and commands Daniel to understand the matter and vision.
  - Seventy sevens are declared upon Daniel's people and holy city.

what_is_explicit:
  - Jeremiah's duration is stated as years.
  - Daniel explicitly cites Jeremiah's writings and Jerusalem's desolations.
  - The seventy sevens revelation occurs in the same chapter after Daniel's prayer concerning the seventy years.

what_is_not_explicit:
  - Daniel 9 does not say in a direct equation that seventy sevens equal seventy times seven years.
  - Daniel 9 does not say the seventy sevens begin when Jeremiah's seventy years begin or end.
  - The shared number seventy does not by itself establish identical units or chronology.
  - 2 Chronicles 36 connects the seventy years with land sabbaths, but does not explicitly identify Daniel 9's sevens as sabbatical years.

candidate_inference:
  statement: The explicit seventy-year setting, the land-sabbath explanation in Chronicles, and the later seventy-sevens revelation may provide cumulative scriptural evidence for investigating a year-based unit.
  evidence_class: E3
  status: research-hypothesis-not-conclusion

unresolved:
  - Whether Gabriel's seventy sevens intentionally expand, replace, or answer Daniel's concern about Jeremiah's seventy years.
  - Whether the land-sabbath language in 2 Chronicles 36 supplies a direct interpretive bridge to Leviticus 25 and Daniel 9.
  - The exact starting word in Daniel 9:25 and its relation to Cyrus's proclamation.

