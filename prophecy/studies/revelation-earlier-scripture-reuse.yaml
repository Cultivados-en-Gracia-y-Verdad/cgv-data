schema_version: 1
record_type: canonical-reuse-study
id: revelation-earlier-scripture-reuse
status: collecting
title: Earlier Scripture quoted or reused in Revelation

question: Which passages from earlier Scripture does Revelation quote, closely reuse, combine, or echo?

source_scope:
  receiving_book: Revelation
  source_corpus: Genesis through Jude
  primary_source_focus: Hebrew, Aramaic, and Greek canonical texts
  external_interpretive_authority: prohibited

inventory:
  path: ../data/revelation-old-testament-reuse-candidates.csv
  current_status: candidate-inventory
  exhaustiveness: not-yet-certified
  note: The inventory is chapter-by-chapter and is intended to be corrected and expanded during original-language review.

important_observation:
  statement: Revelation does not normally introduce earlier Scripture with a quotation formula such as "it is written."
  consequence: Similarity cannot automatically be classified as an explicit quotation.

classification_scale:
  - id: explicit-quotation
    definition: Revelation itself explicitly identifies the wording as spoken or written in an earlier canonical passage.
    evidential_strength: highest
  - id: near-verbatim-textual-reuse
    definition: A distinctive clause or phrase closely corresponds in wording and syntax to an earlier canonical text.
    requirements:
      - compare Revelation Greek with the Greek textual form available for the earlier passage
      - compare with the Hebrew or Aramaic source where applicable
      - record lexical and syntactic overlap
      - test whether the wording is distinctive rather than common biblical vocabulary
  - id: composite-reuse
    definition: A Revelation expression appears to combine wording or images from two or more earlier passages.
    requirement: Each proposed source must be recorded separately; the combination does not establish identity of their original referents.
  - id: image-pattern-reuse
    definition: Revelation uses an earlier canonical image, action, judgment pattern, throne scene, creature description, temple feature, or prophetic sequence without close verbal correspondence.
  - id: thematic-parallel
    definition: The passages address a similar subject but lack enough distinctive verbal or structural evidence to establish textual reuse.
  - id: rejected-candidate
    definition: Review finds the proposed connection too general, textually unsupported, erroneous, or based on an impossible reference.

review_fields_required_per_connection:
  - revelation_reference
  - proposed_source_reference
  - revelation_greek_tokens
  - source_greek_tokens_when_available
  - source_hebrew_or_aramaic_tokens_when_applicable
  - shared_lemmas
  - shared_syntax_or_sequence
  - distinctive_features
  - differences
  - classification
  - confidence
  - reviewer
  - provenance
  - review_status

rules:
  - A cross-reference supplied by an editor or secondary index is only a discovery aid.
  - Shared imagery does not prove that two symbolic figures, kingdoms, cities, persons, or events are identical.
  - Shared vocabulary does not prove chronological alignment.
  - A later passage may reuse an earlier text while changing grammatical subject, scope, temporal placement, or application.
  - Composite reuse must not collapse distinct earlier passages into one event.
  - Every accepted connection must state exactly what the textual reuse establishes and what it does not establish.
  - Corrections to invalid or impossible references must remain visible in provenance notes.

priority_review_clusters:
  - revelation: Revelation 1
    sources: [Daniel 7, Daniel 10, Zechariah 12, Isaiah 44]
  - revelation: Revelation 4-5
    sources: [Exodus 19, Isaiah 6, Ezekiel 1, Daniel 7]
  - revelation: Revelation 6
    sources: [Isaiah 2, Isaiah 34, Jeremiah 15, Hosea 10, Joel 2]
  - revelation: Revelation 8-9
    sources: [Exodus 7-10, Joel 1-2, Ezekiel 9-10]
  - revelation: Revelation 10
    sources: [Ezekiel 2-3, Daniel 8, Daniel 12, Amos 3]
  - revelation: Revelation 11-13
    sources: [Psalm 2, Daniel 7-8, Daniel 10-12, Zechariah 4]
  - revelation: Revelation 14
    sources: [Isaiah 21, Isaiah 34, Isaiah 63, Jeremiah 51, Joel 3]
  - revelation: Revelation 15-16
    sources: [Exodus 7-15, Deuteronomy 32, Jeremiah 25, Zechariah 12]
  - revelation: Revelation 17-19
    sources: [Psalm 2, Isaiah 23, Isaiah 34, Isaiah 47, Isaiah 63, Jeremiah 50-51, Ezekiel 26-28, Ezekiel 39, Daniel 7]
  - revelation: Revelation 20
    sources: [Genesis 3, Isaiah 24-26, Ezekiel 38-39, Daniel 7, Daniel 12]
  - revelation: Revelation 21-22
    sources: [Genesis 2-3, Isaiah 25, Isaiah 52, Isaiah 54, Isaiah 60-66, Ezekiel 37, Ezekiel 40-48, Zechariah 14]

babylon_research_link:
  passages: [Revelation 14:8, Revelation 16:19, Revelation 17:1-18, Revelation 18:1-24, Revelation 19:1-3]
  principal_candidates: [Isaiah 21:9, Isaiah 23:1-18, Isaiah 34:9-15, Isaiah 47:1-15, Jeremiah 25:15-38, Jeremiah 50:1-51:64, Ezekiel 26:1-28:19]
  warning: Reuse of Babylon, Tyre, Nineveh, or Edom language must be recorded without assuming that all original referents are identical to Babylon the Great.

next_steps:
  - Split each CSV row containing multiple source passages into atomic connection records.
  - Verify Revelation Greek against MorphGNT/SBLGNT tokens.
  - Verify Greek source wording where a Greek Old Testament corpus is legally and technically available.
  - Verify the Hebrew or Aramaic source with OSHB.
  - Promote, downgrade, correct, or reject candidates individually.
  - Generate chapter, source-book, lemma, phrase, and confidence indexes from accepted records.
