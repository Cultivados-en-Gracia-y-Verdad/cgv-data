schema_version: 1
record_type: unresolved-assumption
id: babel-babylon-continuity
status: collecting

submitted_claim: Babel in Genesis develops into, continues as, or prophetically corresponds to Babylon and Babylon the Great throughout Scripture.

claim_parts:
  - Genesis Babel and later historical Babylon share the same canonical name.
  - Shinar provides an explicit textual link between Genesis and Daniel.
  - Historical Babylon and prophetic Babylon passages concern the same kingdom or city where the passage identifies them as such.
  - Babylon the Great in Revelation may intentionally draw upon earlier Babylon passages.
  - A continuous political, institutional, religious, commercial, or spiritual entity from Genesis to Revelation may exist.

explicit_data:
  - Genesis names Babel in Shinar and connects it with the beginning of a kingdom, city-building, language confusion, and scattering.
  - Later Hebrew Scripture names Babylon in narratives and prophetic speeches.
  - Daniel 1:2 explicitly uses the name Shinar in the Babylonian exile setting.
  - Revelation explicitly names Babylon the Great and explains selected features within its own visions.

candidate_passages:
  - Genesis 10:8-12
  - Genesis 11:1-9
  - 2 Kings 20:12-19
  - 2 Kings 24:1-25:30
  - Isaiah 13-14
  - Isaiah 21
  - Isaiah 46-47
  - Jeremiah 25
  - Jeremiah 50-51
  - Daniel 1:1-7
  - Zechariah 2:6-13
  - Zechariah 5:5-11
  - Revelation 14:8
  - Revelation 16:19
  - Revelation 17:1-18
  - Revelation 18:1-24
  - Revelation 19:1-3

missing_links:
  - An explicit scriptural statement defining the scope of continuity between Genesis Babel and Revelation's Babylon the Great.
  - Passage-level evidence showing which earlier Babylon or Babel texts Revelation invokes.
  - A scriptural identification of whether the continuity is geographical, governmental, commercial, religious, symbolic, or multiple.
  - Chronological relations connecting the distinct Babylon judgments without collapsing them.

limiting_evidence:
  - A shared proper name proves a lexical connection but does not by itself prove complete referential identity.
  - Revelation's woman, city, waters, kings, merchants, and beast relations must be interpreted according to Revelation's own explanations.
  - Similar themes such as pride, city-building, nations, commerce, idolatry, scattering, or judgment are candidate connections until textually established.
  - Paleo-Hebrew glyph forms provide no evidence for continuity or meaning.

chronology_effect: If stronger continuity is established, Babel/Babylon records may form a long canonical lane from early Genesis through final judgment passages. Until then, the chronology retains separate historical, prophetic, and visionary lanes.

resolution: null
