shared_features:
  - God removes tears
  - death defeated
  - sorrow, crying, and distress ended
  - former affliction replaced by joy

differences:
  - Isaiah 65 retains death at advanced age in the surrounding passage; Revelation says death is no more.
  - Revelation adds pain and states that the former things have passed away.
  - Isaiah's consolations are voiced in Zion and Jerusalem settings; Revelation places them in the new creation and holy city.

classification:
  relation: composite-final-consolation-reuse
  evidence_class: E5
  confidence: very-high

limits:
  - Isaiah 65 must not be flattened into Revelation's explicit abolition of death.
  - The passages support final consolation but do not independently define every stage preceding it.
  - The promise must not be reduced to temporary political relief.
