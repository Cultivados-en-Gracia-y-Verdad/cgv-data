differences:
  - Daniel's image represents Nebuchadnezzar's royal command but is not said to speak or receive breath.
  - Revelation's image represents the beast and is animated to speak.
  - Daniel specifies a fiery furnace; Revelation states death without naming the method in this verse.
  - Daniel narrates faithful refusal and deliverance; Revelation 13 focuses on the coercive system.

