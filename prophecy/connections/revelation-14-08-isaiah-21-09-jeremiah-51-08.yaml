shared_features:
  - Babylon named as fallen
  - repeated fall formula
  - Babylon's wine affecting the nations

differences:
  - Isaiah announces historical Babylon's fall and shattered idols.
  - Jeremiah portrays Babylon as YHWH's golden cup and announces her sudden breaking.
  - Revelation calls her Babylon the Great and describes the wine through wrath and sexual immorality language.
  - Revelation 14 does not yet provide the fuller interpretation supplied in Revelation 17-18.

