shared_features:
  - location within God's house or temple
  - a name given by God
  - the exact Greek phrase family ὄνομα ... καινόν
  - an enduring relation between recipient, God, and the named city

differences:
  - Isaiah 56:5 promises a place and enduring name; Revelation makes the conqueror a pillar and writes names upon the person.
  - Isaiah 62:2 addresses Zion; Revelation promises inscription upon the conqueror.
  - Ezekiel names the city itself; Revelation writes the city's name upon the conqueror.
  - The phrase 'new Jerusalem descending from heaven' is defined internally by Revelation and is not imported from these passages.

classification:
  relation: composite-name-and-house-reuse
  evidence_class: E4
  confidence: high-for-new-name; moderate-for-house-and-city-name-structure

unresolved_elements:
  - Revelation's pillar image is not identified with the named pillars of 1 Kings 7 without stronger textual evidence.
  - The relationship between the inscription promise and Revelation 21:2, 21:10, and 22:4 requires an internal-Revelation connection record.

chronology_effect:
  status: promise-after-overcoming
  statement: The inscription and permanent temple placement are promised to the conqueror; no calendar date is supplied.
