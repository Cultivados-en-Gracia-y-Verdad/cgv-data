      - former things no longer remembered
  - reference: Isaiah 66:22
    language: hebrew
    hebrew_anchor: כִּי כַאֲשֶׁר הַשָּׁמַיִם הַחֲדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה אֲשֶׁר אֲנִי עֹשֶׂה עֹמְדִים לְפָנַי נְאֻם־יְהוָה כֵּן יַעֲמֹד זַרְעֲכֶם וְשִׁמְכֶם
