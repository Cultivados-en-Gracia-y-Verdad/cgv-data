differences:
  - Exodus speaks of God's book without the phrase 'book of life.'
  - Psalm 69 explicitly has 'book of life.'
  - Daniel 12 speaks of those written in the book and delivered.
  - Revelation frames the statement as a promise not to blot out the conqueror's name.

