sources:
  - reference: Isaiah 49:10
    language: hebrew
    hebrew_anchor: לֹא יִרְעָבוּ וְלֹא יִצְמָאוּ וְלֹא־יַכֵּם שָׁרָב וָשָׁמֶשׁ כִּי־מְרַחֲמָם יְנַהֲגֵם וְעַל־מַבּוּעֵי מַיִם יְנַהֲלֵם
    contribution:
      - no hunger
      - no thirst
      - no striking heat or sun
      - compassionate guidance
      - leading to springs of water
    greek_witness_role: Revelation closely follows the sequence and much of the Greek phrase structure of the ancient Greek witness.
  - reference: Isaiah 25:8
    language: hebrew
    hebrew_anchor: וּמָחָה אֲדֹנָי יְהוִה דִּמְעָה מֵעַל כָּל־פָּנִים
