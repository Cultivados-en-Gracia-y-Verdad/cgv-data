  shared_terms_or_structures:
    - fear prohibition
    - first and last formula
    - death and Hades or Sheol pair
    - collapse, touch, and reassurance scene

shared_features:
  - Revelation repeats Isaiah's distinctive first-and-last divine self-designation.
  - Revelation's collapse, right-hand contact, and fear prohibition follow Daniel 10's encounter pattern.
  - Revelation joins death and Hades, a pair present in Hosea's death-and-Sheol oracle.

differences:
  - Revelation adds 'the living one,' death, renewed life, and possession of keys.
  - Isaiah's declarations occur in disputes concerning the LORD's unique identity and sovereignty.
  - Daniel's reassuring figure and Revelation's speaker must not be declared identical solely from the encounter pattern.
  - Hosea asks rhetorical questions concerning ransom and destruction; Revelation uses the image of keys.

classification:
