  - reference: Leviticus 26:11-12
    language: hebrew
    hebrew_anchor: וְנָתַתִּי מִשְׁכָּנִי בְּתוֹכְכֶם ... וְהִתְהַלַּכְתִּי בְּתוֹכְכֶם
    contribution: God's dwelling presence among his people

shared_features:
  - divine dwelling or tabernacling presence
  - absence of hunger and thirst
  - protection from sun and heat
  - shepherding
  - guidance to water springs
  - removal of tears

differences:
  - Isaiah 49 attributes guidance to the compassionate one; Revelation identifies the Lamb as shepherd and guide.
  - Revelation paradoxically presents the Lamb as the shepherd.
  - Isaiah 25 speaks of wiping tears from all faces; Revelation speaks of every tear from their eyes.
  - Leviticus describes covenant dwelling among Israel; Revelation describes the enthroned one spreading his dwelling over the multitude.
  - Psalm 23 and Ezekiel 34 contribute shepherd imagery but do not reproduce Isaiah 49's full ordered sequence.

classification:
  relation: composite-near-verbatim-and-image-reuse
  evidence_class: E5
  confidence:
    isaiah_49_sequence: very-high
    isaiah_25_tears: high
    shepherd_sources: moderate-to-high
    tabernacling_source: moderate

chronology_effect:
  status: resulting-condition
  statement: Revelation presents these conditions as the state of the multitude after coming through the great tribulation and standing before the throne.

limits:
  - The connection does not by itself define the duration or calendar placement of the great tribulation.
  - Shared shepherd imagery does not collapse Psalm 23, Ezekiel 34, Isaiah 49, and Revelation 7 into one undifferentiated event.
