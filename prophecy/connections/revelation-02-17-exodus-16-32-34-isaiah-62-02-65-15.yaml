greek_bridge:
  manna:
    shared_term: μάννα
    status: explicit-lexical-continuity
  new_name:
    shared_phrase_family: ὄνομα καινόν
    status: strong
  white_stone:
    status: unresolved-source
    note: No Old Testament source is assigned merely from the presence of a stone, whiteness, or writing.

shared_features:
  - divinely controlled provision
  - manna retained out of ordinary public consumption
  - a newly given name
  - the gift is directed to a defined recipient

differences:
  - Exodus calls the manna preserved or kept; Revelation calls it hidden.
  - Isaiah gives the new name to Zion or to God's servants; Revelation gives a written new name to the conqueror.
  - Revelation's white stone and exclusive knowledge are not explicitly supplied by the cited passages.

classification:
  relation: composite-reuse
  evidence_class: E4
  confidence: high-for-manna-and-new-name; unresolved-for-white-stone

chronology_effect:
  status: promise-after-overcoming
  statement: Revelation places receipt of the hidden manna and new name after conquering.

limits:
  - The record does not identify the white stone with any particular Old Testament object.
  - The preserved manna in Exodus and hidden manna in Revelation are connected lexically and narratively without asserting material identity.
