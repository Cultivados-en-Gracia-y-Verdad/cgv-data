schema_version: 1
record_type: canonical-connection
id: connection-revelation-19-01-03-deuteronomy-32-43-isaiah-34-10
status: verified-composite-judgment-praise-reuse

revelation:
  reference: Revelation 19:1-3
  language: greek
  source_anchor:
    corpus: MorphGNT
    verse_codes: [271901, 271902, 271903]
  original_anchors:
    - Ἁλληλουϊά
    - ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ
    - ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς
    - ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων

sources:
  - reference: Deuteronomy 32:43
    language: hebrew
    hebrew_anchor: הַרְנִינוּ גוֹיִם עַמּוֹ כִּי דַם־עֲבָדָיו יִקּוֹם וְנָקָם יָשִׁיב לְצָרָיו וְכִפֶּר אַדְמָתוֹ עַמּוֹ
    contribution:
      - praise following divine judgment
      - vengeance for the blood of God's servants
      - repayment directed against adversaries
    greek_witness_bridge:
      status: strong
      note: The ancient Greek textual tradition explicitly joins rejoicing with divine vengeance for servants' blood, providing a close verbal bridge to Revelation's ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ.
  - reference: Isaiah 34:9-10
    language: hebrew
    hebrew_anchor: לַיְלָה וְיוֹמָם לֹא תִכְבֶּה לְעוֹלָם יַעֲלֶה עֲשָׁנָהּ מִדּוֹר לָדוֹר תֶּחֱרָב
    contribution:
      - unextinguished judgment fire
      - smoke rising perpetually
      - irreversible desolation

shared_features:
  - heavenly or international praise because God's judgments are just
  - vengeance for the shed blood of God's servants
  - the judged enemy's smoke rising perpetually

differences:
  - Deuteronomy addresses divine repayment to Israel's adversaries; Revelation applies the vengeance formula to the great prostitute.
  - Isaiah 34 concerns judgment on Edom and the nations; Revelation applies the perpetual-smoke formula to Babylon.
  - Revelation repeats Hallelujah and embeds both source patterns in its own heavenly liturgy.

classification:
  relation: composite-judgment-praise-reuse
  evidence_class: E5
  confidence:
    servant_blood_vengeance: very-high
    perpetual_smoke_formula: very-high
    same_historical_event: not-established

chronology_effect:
  status: judgment-followed-by-praise
  statement: Revelation presents Babylon's judgment as accomplished before the heavenly praise, but the source passages do not independently determine Revelation's complete sequence.

limits:
  - The combination does not make Babylon identical to every adversary in Deuteronomy or to Edom in Isaiah.
  - The perpetual-smoke formula communicates irreversible judgment and must not be used alone to construct a geographical identification.
  - The ancient Greek witness functions as a lexical bridge, not as the original-language authority for Deuteronomy.
