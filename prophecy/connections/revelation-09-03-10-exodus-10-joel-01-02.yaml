shared_features:
  - locust designation
  - landward release under divine control
  - horse-like battle appearance
  - chariot-like sound
  - preparation for war
  - lion-like teeth
  - atmospheric or luminary darkening in the surrounding scene

differences:
  - Exodus and Joel describe vegetation-consuming locusts or an army through locust imagery; Revelation forbids harm to grass, green growth, and trees.
  - Revelation targets unsealed humans and gives the creatures scorpion-like torment.
  - Revelation adds abyss origin, hybrid human and animal features, iron-like breastplates, crowns, and a five-month limit.
  - Joel does not identify its army as Revelation's abyss locusts.

