greek_bridge:
  status: strong
  shared_phrase_families:
    - ἔργα χειρῶν
    - χρυσός / ἄργυρος / χαλκός / λίθος / ξύλον
    - οὔτε βλέπειν / οὔτε ἀκούειν / οὔτε περιπατεῖν

shared_features:
  - idols characterized as human handiwork
  - lists of idol materials
  - inability to see and hear
  - inability to walk supplied by the Psalm tradition

differences:
  - Daniel includes iron and says the idols do not know; Revelation omits iron and knowing, adds walking, and includes demons alongside idols.
  - Psalms 115 and 135 emphasize mouth, hands, and other bodily incapacity beyond Revelation's three verbs.
  - Revelation places the formula after trumpet plagues and emphasizes refusal to repent.

classification:
  relation: composite-near-verbatim-reuse
  evidence_class: E5
  confidence: high

chronology_effect:
  status: post-plague-response
  statement: Revelation explicitly places continued idolatry and non-repentance after the preceding plagues.

limits:
  - The material list does not identify a particular historical idol or empire.
  - The connection establishes reuse of anti-idol formulas, not identity of every idol mentioned in Daniel, Psalms, and Revelation.
