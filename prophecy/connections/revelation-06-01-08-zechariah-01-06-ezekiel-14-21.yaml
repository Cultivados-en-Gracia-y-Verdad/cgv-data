shared_features:
  - fourfold sequence of colored horses
  - agents released into the earth
  - divinely permitted action
  - sword, famine, death or pestilence, and beasts

differences:
  - Revelation assigns individual riders, weapons, names, and effects that Zechariah does not provide.
  - Zechariah presents chariots in chapter 6; Revelation presents mounted riders.
  - Revelation's first horse is white and carries a bow; no Old Testament source here identifies that rider.
  - Revelation calls the fourth rider Death with Hades following; Ezekiel supplies the judgment list, not those personifications.
  - The pale or green color χλωρός is not identical to Zechariah's dappled-horse wording.

classification:
  relation: composite-transformed-image-and-judgment-list-reuse
  evidence_class: E5
