shared_features:
  - a fourfold wind formula
  - relation to the world's extremities or total geographic scope
  - winds operating under divine control
  - heavenly agents connected with the winds

differences:
  - Revelation calls the heavenly agents four angels and says they restrain the winds.
  - Jeremiah describes winds brought against Elam from heaven's four extremities.
  - Daniel describes the winds stirring the great sea.
  - Zechariah identifies its four chariot groups as the four winds or spirits of heaven going out.
  - Revelation says winds of the earth rather than winds of heaven.

classification:
  relation: transformed-four-winds-reuse
  evidence_class: E4
  confidence: high-for-phrase-family; moderate-for-specific-source-allocation

chronology_effect:
  status: explicit-restraint-before-harm
  statement: Revelation places restraint of the four winds before damage to earth, sea, and trees and before the servants are sealed.

limits:
  - Shared four-winds language does not prove that Revelation's angels are identical to Zechariah's chariot agents.
  - The winds' actions differ in Jeremiah, Daniel, Zechariah, and Revelation.
  - The four corners expression is not used to impose a geometric cosmology.
