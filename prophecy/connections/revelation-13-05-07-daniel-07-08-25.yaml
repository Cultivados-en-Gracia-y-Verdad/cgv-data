shared_features:
  - boastful or blasphemous speech
  - hostility toward God
  - war against the holy ones
  - temporary victory over them
  - divinely bounded authority

differences:
  - Daniel assigns these features to the little horn; Revelation assigns them to the composite sea beast.
  - Revelation states forty-two months, while Daniel states a time, times, and half a time.
  - Revelation extends authority over every tribe, people, language, and nation.
  - Daniel describes attempted changes to times and law; Revelation 13 does not repeat that feature.

classification:
  relation: near-verbatim-action-and-chronology-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: internally-supported-equivalence
  statement: Revelation 12:6 and 12:14 explicitly equate 1,260 days with a time, times, and half a time. Revelation 13:5 adds forty-two months to the same persecution complex, strongly linking all three expressions within Revelation's own chronology.

limits:
  - The equivalence establishes a textual period relation, not a starting calendar date.
  - The record does not identify a modern ruler or institution.
  - Temporary victory over the holy ones is not final victory; Daniel and Revelation both place the persecutor under later judgment.
