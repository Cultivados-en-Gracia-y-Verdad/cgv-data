  contribution:
    - thrones placed in a heavenly judgment scene
    - court seated and books opened
    - judgment given for the holy ones
    - kingdom and dominion given to the holy people

shared_features:
  - thrones in a judgment setting
  - judgment granted in favor of or to the saints
  - the saints receiving royal participation
  - defeat of beastly opposition preceding the saints' reign

differences:
  - Daniel does not describe beheaded witnesses, beast-mark refusal, first resurrection, priesthood, or a thousand-year reign.
  - Revelation specifies that the faithful live and reign with Christ.
  - Daniel's kingdom is described as everlasting; Revelation 20 marks a thousand-year phase before later events.

classification:
  relation: aramaic-driven-throne-judgment-and-saints-reign-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: bounded-by-revelation
  statement: Daniel establishes the sequence of beast judgment followed by saintly rule, but Revelation alone supplies the thousand years and first-resurrection terminology.

limits:
  - Daniel 7 does not independently define the identity or full membership of those seated on Revelation's thrones.
  - The thousand years must not be derived from Daniel's time expressions.
  - The connection does not resolve broader millennial-system debates beyond the explicit wording of Revelation 20.
