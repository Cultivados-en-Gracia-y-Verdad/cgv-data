shared_features:
  - God's people directly commanded to leave Babylon
  - separation precedes Babylon's judgment
  - remaining risks participation in her punishment
  - judgment is framed as divine recompense

differences:
  - Jeremiah addresses Judeans in relation to historical Babylon.
  - Revelation explicitly adds nonparticipation in Babylon's sins as the reason for separation.
  - Revelation describes receiving her plagues rather than Jeremiah's historical military destruction language.

classification:
  relation: explicit-imperative-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: explicit-warning-before-judgment
  statement: In Revelation's discourse, the call to separate precedes the announced execution of Babylon's plagues.

limits:
  - The command establishes moral and covenantal separation but does not by itself define whether departure is geographical, social, economic, or some combination.
  - The historical return from Babylon must not be treated as a complete one-to-one chronology for Revelation 18.
  - The identity of Babylon remains controlled by Revelation 17-18.
