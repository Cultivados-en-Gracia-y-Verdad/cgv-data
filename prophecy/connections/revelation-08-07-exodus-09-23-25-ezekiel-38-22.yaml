shared_features:
  - hail and fire combined in a divinely initiated plague
  - the destructive action reaches the earth
  - vegetation or trees are damaged
  - Ezekiel supplies the unusual blood-hail-fire judgment cluster

differences:
  - Exodus does not mention blood in the hail plague.
  - Ezekiel 38:22 lists blood, hailstones, fire, sulfur, rain, and pestilence; Revelation selects hail, fire, and blood.
  - Revelation says the elements are mixed in blood and restricts the burning to thirds, while Exodus and Ezekiel do not.
  - Revelation burns every green grass within its stated scope; Exodus describes agricultural destruction in Egypt.

classification:
  relation: composite-plague-reuse
  evidence_class: E5
  confidence: high

chronology_effect:
  status: first-trumpet-sequence
  statement: The plague follows the first trumpet and affects a stated third of earth and trees.

limits:
  - The lexical and plague-pattern connection does not prove that the Egyptian plague, Ezekiel 38 judgment, and first trumpet are one event.
  - The one-third proportions belong to Revelation and must not be imported into Exodus or Ezekiel.
  - Blood must not be retrojected into Exodus 9, where it is absent.
