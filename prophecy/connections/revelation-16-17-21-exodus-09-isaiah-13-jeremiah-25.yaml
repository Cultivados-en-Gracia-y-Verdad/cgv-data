shared_features:
  - an unprecedented judgment event
  - shaking of earth and political structures
  - Babylon brought into divine remembrance for wrath
  - the cup of wrath
  - extraordinary hail
  - collapse or displacement of created terrain

differences:
  - Exodus's hail falls on Egypt and spares Goshen; Revelation describes global-scale terrain disruption and Babylon's judgment.
  - Isaiah and Jeremiah address historical Babylon within their own prophetic horizons.
  - Revelation combines earthquake, city division, Babylon's cup, fleeing islands, missing mountains, and massive hail in one final bowl scene.
  - Revelation gives the hailstone comparison as about a talent; the source texts do not provide that weight.

classification:
  relation: composite-cosmic-plague-and-babylon-judgment-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: terminal-bowl-sequence
  statement: The proclamation "It is done" marks the seventh bowl's completion within Revelation; the source texts do not independently date this event.

limits:
  - Historical Babylon passages supply judgment language without exhausting Revelation's later interpretation of Babylon the Great.
  - The hail comparison must not be converted into a precise modern meteorological prediction beyond the text.
  - The disappearance of islands and mountains must not be reduced to metaphor solely because the source texts use cosmic shaking language.
