      - nations compelled to drink
      - unavoidable judgment
  - reference: Psalm 75:8
    language: hebrew
    hebrew_anchor: כִּי כוֹס בְּיַד־יְהוָה וְיַיִן חָמַר מָלֵא מֶסֶךְ וַיַּגֵּר מִזֶּה אַךְ־שְׁמָרֶיהָ יִמְצוּ יִשְׁתּוּ כֹּל רִשְׁעֵי־אָרֶץ
    contribution:
      - a cup in YHWH's hand
      - mixed wine
      - the wicked forced to drain it
  - reference: Isaiah 51:17,22
    language: hebrew
    hebrew_anchors:
      - אֲשֶׁר שָׁתִית מִיַּד יְהוָה אֶת־כּוֹס חֲמָתוֹ
      - אֶת־קֻבַּעַת כּוֹס הַתַּרְעֵלָה שָׁתִית מָצִית
    contribution:
      - cup of YHWH's wrath
      - drinking the cup to its dregs

shared_features:
  - divine wrath portrayed as wine
  - a cup administered by God
  - compulsory drinking by the judged
  - complete and inescapable consumption

differences:
  - Jeremiah emphasizes judgment among nations and Jerusalem.
  - Psalm 75 emphasizes the wicked draining the cup's dregs.
  - Isaiah addresses Jerusalem's experience and later removal of the cup.
  - Revelation applies the cup individually to worshipers of the beast and adds fire and sulfur punishment.

classification:
  relation: composite-wrath-cup-reuse
  evidence_class: E5
  confidence: high

limits:
  - The cup imagery does not make every biblical wrath-cup scene the same event.
  - Revelation's fire-and-sulfur clause requires its own source analysis and is not supplied by Jeremiah 25 or Psalm 75 alone.
