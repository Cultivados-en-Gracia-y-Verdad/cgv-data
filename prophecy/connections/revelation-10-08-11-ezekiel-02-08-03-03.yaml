shared_features:
  - a scroll is given by a heavenly figure
  - command to eat the scroll
  - completed act of eating
  - explicit bodily interior language
  - sweetness like honey in the mouth
  - prophetic commission following ingestion

differences:
  - Ezekiel's scroll contains lamentations, mourning, and woe and is written front and back; Revelation describes a little opened scroll.
  - Ezekiel says the scroll fills the belly and is sweet in the mouth but does not say the belly becomes bitter.
  - Revelation adds bitterness after the sweetness.
  - Ezekiel is commissioned to speak to the house of Israel; Revelation commissions prophecy concerning many peoples, nations, languages, and kings.
  - Revelation receives the scroll from an angel standing on sea and land; Ezekiel receives it from an extended hand within his throne vision.

classification:
  relation: near-verbatim-action-sequence-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: vision-sequence-only
  statement: Revelation places the renewed prophetic commission before the seventh trumpet developments; Ezekiel's commission is not thereby identified as the same event.

limits:
  - The scroll-eating action is a prophetic commissioning pattern in these passages and must not be assigned as a universal symbol for every book or vision.
  - Revelation's bitterness must not be retrojected into Ezekiel's account.
  - The shared sequence does not make Ezekiel and John the same prophetic figure or their audiences identical.
