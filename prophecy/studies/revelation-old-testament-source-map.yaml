schema_version: 1
record_type: canonical-source-map
id: study-revelation-old-testament-source-map
status: collecting
title: Revelation use of earlier canonical terms, phrases, passages, and image structures

question: Where does Revelation draw wording, terms, syntax, images, and passage structures from the Hebrew, Aramaic, and Greek Scriptures?

source_scope:
  canon: Protestant 66-book canon
  primary_languages:
    old_testament: [hebrew, aramaic]
    new_testament: [greek]
  bridge_witnesses:
    - identified ancient Greek Old Testament witnesses
  prohibited_evidence:
    - commentary conclusions
    - theological systems
    - editorial cross-reference headings as proof
    - historical identifications not made by Scripture

comparison_columns:
  - revelation_greek
  - greek_old_testament_witness
  - hebrew_or_aramaic_source

relation_classes:
  - id: explicit-attribution
    definition: Revelation explicitly names the earlier source or writer.
  - id: near-verbatim-reuse
    definition: A distinctive phrase is reproduced with close lexical and syntactic agreement.
  - id: composite-reuse
    definition: One Revelation unit combines distinguishable wording or structures from multiple earlier passages.
  - id: hebrew-or-aramaic-driven-reuse
    definition: Revelation agrees more closely with the Hebrew or Aramaic source than with the selected Greek witness.
  - id: greek-witness-driven-reuse
    definition: Revelation shares distinctive Greek wording with an identified Greek Old Testament witness.
  - id: image-structure-reuse
    definition: A sequence of images or actions corresponds without enough verbal agreement for a quotation classification.
  - id: thematic-parallel
    definition: A possible conceptual relationship lacking distinctive verbal or structural evidence.
  - id: rejected-candidate
    definition: The proposed relationship is too general or contradicted by textual comparison.

rules:
  - Revelation contains no automatic connection merely because an earlier passage has a similar image.
  - Shared Greek wording can establish textual reuse but not identity of events or exhaustive fulfillment.
  - Agreement with Hebrew or Aramaic must be recorded independently from agreement with an ancient Greek witness.
  - A composite passage must retain each source contribution separately.
  - Differences are evidence and must be stored, not harmonized away.
  - Revelation's internal interpretations control the scope of its symbols.
  - Chronology is added only where Revelation or the connected passage explicitly supplies order.

first_verified_batch:
