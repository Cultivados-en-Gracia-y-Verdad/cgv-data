shared_features:
  - heavenly messenger or agent
  - fire taken from a sacred heavenly location
  - fire cast downward upon the earthly realm
  - judgment follows the casting

differences:
  - Ezekiel places the fire among the cherubim and casts it upon the city.
  - Revelation takes fire from the altar and casts it to the earth.
  - Revelation adds thunder, voices, lightning, and an earthquake.
  - Ezekiel's agent is the linen-clothed man; Revelation names an angel.

