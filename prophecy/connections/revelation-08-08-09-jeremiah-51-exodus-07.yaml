shared_features:
  - mountain imagery joined to burning judgment
  - downward casting into water
  - water becoming blood
  - death of creatures living in the water

differences:
  - Jeremiah 51 explicitly addresses Babylon; Revelation does not identify the burning mountain within this verse.
  - Jeremiah's symbolic stone is thrown into the Euphrates, not a burning mountain into the sea.
  - Exodus concerns the Nile and waters of Egypt; Revelation concerns one third of the sea.
  - Revelation adds destruction of ships and repeated one-third proportions.
  - Revelation says the object is like a great burning mountain, preserving a comparison rather than explicitly naming it as a literal mountain.

classification:
  relation: composite-image-and-plague-reuse
  evidence_class: E5
  confidence:
    burning_mountain_cluster: high
    water_to_blood_and_aquatic_death: high
    identification_with_babylon: unresolved

chronology_effect:
  status: trumpet-sequence-only
  statement: The event follows the second trumpet; the source passages do not establish that their historical judgments and Revelation's trumpet are the same event.

limits:
  - The mountain is not identified as Babylon solely because Jeremiah 51 uses a burning-mountain judgment image for Babylon.
  - The record establishes textual reuse, not geographical identity between the Euphrates, Nile, and sea.
