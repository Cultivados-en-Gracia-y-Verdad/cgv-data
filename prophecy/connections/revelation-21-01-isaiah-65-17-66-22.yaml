greek_bridge:
  status: explicit
  key_phrase: οὐρανὸν καινὸν καὶ γῆν καινήν

shared_features:
  - new heavens and new earth created by God
  - former order displaced
  - enduring renewed creation

differences:
  - Isaiah 65 continues with death, long life, building, planting, and offspring; Revelation 21:4 later states that death is no more.
  - Revelation explicitly says the first heaven and earth passed away.
  - Revelation alone says the sea is no more.

classification:
  relation: near-verbatim-new-creation-reuse
  evidence_class: E5
  confidence: very-high

chronology_effect:
  status: revelation-controlled
  statement: Isaiah establishes the promised new creation; Revelation places it after the great white throne scene.

limits:
  - The absence of the sea must not be imported into Isaiah 65 or Isaiah 66.
  - Isaiah's new-creation language must not be forced to answer every question about continuity or discontinuity in Revelation 21.
  - The connection does not identify a modern political program as the new creation.
